task: clean_binary
training:
  epochs: 200
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 1.0e-06
  warmup_epochs: 5
  grad_accum_steps: 2
  grad_clip_norm: 0.5
  mixup_alpha: 0.2
  mixup_probability: 0.8
  patience: 50
  gamma: 2.5
  label_smoothing: 0.2
  weighted_sampling: true
  train_augmentation: true
  num_workers: 0
