# Main ZCHSound protocol (Section II-D), not the separate W1-W5 controls.
task: clean_multiclass
protocol: zch_main
implementation_notes:
  - "Main-section smoothing magnitude is unspecified; 0.2 is an explicit public default."
  - "Inverse-frequency alpha is normalised to training-sample mean one."
  - "Additional waveform augmentation/sampling are disabled; W1-W5 use separate settings."
training:
  epochs: 200
  min_epochs: 1
  replicas: 1
  batch_size: 16
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  scheduler: warmup_cosine
  warmup_epochs: 10
  min_learning_rate: 1.0e-6
  plateau_factor: 0.5
  plateau_patience: 8
  grad_accum_steps: 4
  grad_clip_norm: 1.0
  mixup_alpha: 0.4
  mixup_probability: 0.6
  patience: 20
  loss: smoothed_focal
  gamma: 2.5
  label_smoothing: 0.2
  class_weighting: inverse_frequency
  sampling: shuffle
  train_augmentation: false
  selection: uar
  selection_unit: segment
  ema_decay: null
  num_workers: 0
calibration:
  enabled: false
